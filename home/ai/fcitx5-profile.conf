# fcitx5 の入力メソッドプロファイル（~/.config/fcitx5/profile 相当）。
# home/ai/japanese-input.nix から ~/.config/fcitx5/profile として配置される。
[Groups/0]
# グループ名
Name=Default
# 既定のキーボードレイアウト
Default Layout=jp
# 既定の入力メソッド（起動直後は英数直接入力）
DefaultIM=keyboard-jp

[Groups/0/Items/0]
# 英数直接入力用のキーボード
Name=keyboard-jp
Layout=

[Groups/0/Items/1]
# かな漢字変換（Mozc）
Name=mozc
Layout=

[GroupOrder]
0=Default
