# noctalia設定（issue #21: 普段使いのFedora環境と同一の設定）
# 配置先: ~/.config/noctalia/settings.toml
# リファレンス: https://github.com/noctalia-dev/noctalia-shell
# 壁紙のパスは実機固有のため含めていない（issue #21の指示通り）。

[bar]
position = "left"

[dock]
enabled = true
position = "left"
icon_size = 47
pinned = ["firefox"]
smart_auto_hide = true

[theme]
palette = "Catppuccin Macchiato Rosewater"
mode = "auto"
wallpaper_scheme = "muted"

[polkit_agent]
enabled = true
