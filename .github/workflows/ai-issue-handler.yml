name: AI Issue Handler

# セキュリティ設計（v3: 共有エージェントループ glm_agent.py への移行版。旧版は固定5ファイルの
# context を渡すだけの単発OpenRouter呼び出しだった）:
# - トリガーは `issues: labeled` イベント、または `workflow_dispatch`（issue_number入力、
#   手動実行用）。`labeled` はGitHubのデフォルト権限では issue へのラベル付与に triage/write
#   権限が必要なため、公開リポジトリで誰でも作成できる issue 本文だけではこのワークフローは
#   起動しない（`package-request` ラベルを付けられる=信頼できる人だけが起動できる）。
#   `workflow_dispatch` は actions:write 権限を持つ人のみ実行可能。`inputs.issue_number` は
#   チェックアウトより前の専用ステップで `^[1-9][0-9]*$` に一致することを検証する
#   （`type: number` はUI入力補助に過ぎず、GitHub REST経由のdispatchでは任意の文字列を渡せる
#   ため強制力を持たない）。
# - issue本文・タイトルは信頼できない入力として扱う。シェルの `run:` ブロックに直接
#   `${{ github.event.issue.body }}` を埋め込まない。`labeled` 時はstep-level `env:` 経由で
#   受け取って `printf` で、`workflow_dispatch` 時は `gh api` の出力をリダイレクトで、それぞれ
#   `$RUNNER_TEMP/issue_title.txt` / `issue_body.txt` に書き出す（`$GITHUB_ENV` は使わない。
#   複数行の本文に `KEY=VALUE` 区切りを仕込んで任意の環境変数を注入される経路になるため）。
#   Python側はこの2ファイルを読み、`ai_pipeline.sanitize_text()` を通してから使う。
# - AI（OpenRouter経由のGLM 5.3、`.github/scripts/glm_agent.py` の共有エージェントループ）は
#   list/read/write/delete/run の各ツールで自律的にリポジトリを調べ、変更し、検証する。
#     1. 書き込み・削除できるファイルパスは modules/ai/**, home/ai/**, tests/ai/**（直下のみ、
#        ネスト禁止）に限定され、glm_agent.py が ai_pipeline.py の allow-list で機械的に検証
#        する。ループ終了後も同じ allow-list でステージされた差分を再検証する（最終防御）。
#     2. これはサンドボックスではない（許可パス内でも任意のNixOSオプションを設定できる。
#        run_command も niri/nix/nix-instantiate の許可リスト内で任意引数を実行できる）。
#        実質的な防御線は、マージ前に人間がPRの全差分を読むこと。
#     3. 生成後は構文チェックのみ（nix-instantiate --parse）を行う。実際のビルド検証は
#        既存の check-light.yml に委ね、ここでは重複したビルドを行わない。
#     4. 危険そうな構文（ai_pipeline.py の advisory scan）を検出した場合はPRにラベルを
#        付けるだけで、生成自体をブロックはしない（ブロックできるほど正規表現は信頼できない）。
# - 検証ロジック（ai_pipeline.py / glm_agent.py）は必ず main からのみ取得する（path: _trusted）。
#   このブランチ自身がその検証ロジックを書き換えて自己正当化することはできない。
# - pushはURL引数にのみトークンを埋め込み、`.git/config` には一切書き込まない
#   （`persist-credentials: false` + push時のみ `x-access-token:` 形式のURL）。
on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        required: true
        type: number

permissions:
  contents: write
  pull-requests: write
  actions: write
  issues: write

concurrency:
  group: ai-branch-ai/issue-${{ inputs.issue_number || github.event.issue.number }}

jobs:
  ai-edit:
    if: (github.event_name == 'workflow_dispatch' || github.event.label.name == 'package-request') && vars.AI_PIPELINE_ENABLED == 'true' && vars.AI_AGENT_LOOP_HANDLER == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BRANCH: ai/issue-${{ inputs.issue_number || github.event.issue.number }}
      ISSUE_NUMBER: ${{ inputs.issue_number || github.event.issue.number }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: issue_number の検証（不正な値ならチェックアウト前にジョブを失敗させる）
        run: |
          if ! [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::issue_number が不正です: $ISSUE_NUMBER"
            exit 1
          fi

      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: 作業ブランチをmainから作成（既存でも強制的にリセット）
        run: git checkout -B "$BRANCH"

      - name: "Issueのタイトル・本文を取得（issues:labeled: イベントペイロードから$RUNNER_TEMPへ書き出し）"
        if: github.event_name != 'workflow_dispatch'
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          printf '%s' "$ISSUE_TITLE" > "$RUNNER_TEMP/issue_title.txt"
          printf '%s' "$ISSUE_BODY" > "$RUNNER_TEMP/issue_body.txt"

      - name: "Issueのタイトル・本文を取得（workflow_dispatch: GitHub APIから取得し$RUNNER_TEMPへ書き出し）"
        if: github.event_name == 'workflow_dispatch'
        run: |
          gh api "repos/$GH_REPO/issues/$ISSUE_NUMBER" --jq '.title' > "$RUNNER_TEMP/issue_title.txt"
          gh api "repos/$GH_REPO/issues/$ISSUE_NUMBER" --jq '.body // ""' > "$RUNNER_TEMP/issue_body.txt"

      - name: 信頼済みスクリプトの取得前に_trusted/をgit管理から除外登録
        run: echo '_trusted/' >> .git/info/exclude

      - name: 信頼済みスクリプトをmainから取得（このブランチ自身では書き換えられない）
        uses: actions/checkout@v4
        with: { ref: main, path: _trusted, persist-credentials: false }

      - uses: cachix/install-nix-action@v27

      - name: Cachix（piのビルド用、読み取りのみ・pushなし）
        if: vars.AI_HANDLER_ENGINE == 'pi'
        uses: cachix/cachix-action@v15
        with:
          name: nixos-furubese-t480s-5gb
          # install-nix-action直後・"niriをインストール"（nix profile install）より前に
          # 置く必要がある（ai-issue-autofix.ymlと同じ理由、.omc/plans/pi-harness-migration.md
          # v7参照：nix profile installが先に走るとnix-envベースのcachixインストーラが
          # 「profile is incompatible with nix-env」で失敗する）。

      - name: niriをインストール（flake.lockのピンを使用。--inputs-from . 必須）
        timeout-minutes: 5
        run: nix profile install --inputs-from . nixpkgs#niri

      - name: credentialが.git/configに残っていないことを確認（push前の事前チェック）
        run: |
          if git config --get-regexp '^http\..*extraheader' >/dev/null 2>&1; then
            echo "::error::credential leak detected: http.*.extraheader is set in .git/config"
            exit 1
          else
            echo "(no extraheader — OK)"
          fi
          origin_url="$(git config --get remote.origin.url)"
          case "$origin_url" in
            *x-access-token:*|*@*)
              echo "::error::credential leak detected: remote.origin.url contains an embedded token: $origin_url"
              exit 1
              ;;
            *)
              echo "remote.origin.url: $origin_url (no embedded token — OK)"
              ;;
          esac

      - name: モデルへの初回メッセージを構築（glm/pi両分岐が同じファイルを読む）
        run: |
          python3 <<'PYEOF'
          import os
          import sys

          sys.path.insert(0, "_trusted/.github/scripts")
          import ai_pipeline  # noqa: E402

          runner_temp = os.environ["RUNNER_TEMP"]
          issue_number = os.environ["ISSUE_NUMBER"]

          with open(os.path.join(runner_temp, "issue_title.txt"), encoding="utf-8") as f:
              issue_title = ai_pipeline.sanitize_text(f.read(), max_len=300)
          with open(os.path.join(runner_temp, "issue_body.txt"), encoding="utf-8") as f:
              issue_body = ai_pipeline.sanitize_text(f.read(), max_len=4000)

          initial_message = f"""issue #{issue_number} の内容に対応してください。

          --- issue #{issue_number} タイトル ---
          {issue_title}

          --- issue #{issue_number} 本文 ---
          {issue_body}
          """

          # 分岐ごとに組み立て直すとglm版とpi版でモデルに渡る文面が食い違う。
          # 構築はここ1箇所だけで行い、両分岐はこのファイルを読むだけにする。
          with open(os.path.join(runner_temp, "initial_message.txt"), "w", encoding="utf-8") as f:
              f.write(initial_message)
          PYEOF

      - name: GLMエージェントループを実行し、許可パスへ書き込む
        if: vars.AI_HANDLER_ENGINE != 'pi'
        run: |
          python3 <<'PYEOF'
          import os
          import sys

          sys.path.insert(0, "_trusted/.github/scripts")
          import glm_agent  # noqa: E402

          runner_temp = os.environ["RUNNER_TEMP"]
          issue_number = os.environ["ISSUE_NUMBER"]
          with open(os.path.join(runner_temp, "initial_message.txt"), encoding="utf-8") as f:
              initial_message = f.read()

          result = glm_agent.run_agent_loop(initial_message, commit_trailer=None)
          if result["aborted"]:
              sys.exit(1)

          with open(os.path.join(runner_temp, "commit_msg.txt"), encoding="utf-8") as f:
              base_commit_msg = f.read()
          final_commit_msg = (
              f"{base_commit_msg}\n"
              "AI-generated (OpenRouter GLM 5.3), needs review.\n"
              f"Refs #{issue_number}\n"
          )
          with open(os.path.join(runner_temp, "commit_msg_final.txt"), "w", encoding="utf-8") as f:
              f.write(final_commit_msg)
          PYEOF

      - name: pi ハーネスで修正・検証・書き込みを行う
        if: vars.AI_HANDLER_ENGINE == 'pi'
        # _trusted/ はこのワークスペース内のサブディレクトリ（mainからのcheckout、上の
        # ".git/info/exclude" 登録でこのブランチからは追跡されない）。autofixの
        # $RUNNER_TEMP/trusted とは配置が異なるが、どちらも「mainからのcheckout」である
        # という不変条件は同じ。submitが呼ばれずに終了した場合pi_run.sh自身がexit 1する。
        run: |
          # $'...\n...' を使う（YAMLブロックスカラー内でクォート文字列を複数行に
          # 分けると、継続行のインデントがそのまま文字列内の余分な空白として
          # 混入し、glm分岐とバイト単位で食い違う）。
          trailer=$'AI-generated (pi harness, OpenRouter GLM 5.3), needs review.\nRefs #'"$ISSUE_NUMBER"
          # 実測（issue #101, run 37170780678）：既定値（glmの現行ライブ値15/40と同一）では
          # niri/noctalia見直しのような複数ファイル調査タスクでglmと全く同じ故障モード
          # （ツール呼び出し上限到達、submit未呼び出し）を再現した。ユーザーの指示により、
          # pi分岐のみ一時的に上限を上げて再テストする（glm分岐は15/40のまま変更しない——
          # ハーネスの差ではなく予算の差を見る比較になるため、結果は参考値として扱うこと）。
          export PI_MAX_TURNS=25
          export PI_MAX_TOOL_CALLS=60
          "$GITHUB_WORKSPACE/_trusted/.github/scripts/pi_run.sh" \
            --repo-root "$GITHUB_WORKSPACE" \
            --runner-temp "$RUNNER_TEMP" \
            --message-file "$RUNNER_TEMP/initial_message.txt" \
            --commit-trailer "$trailer"
          # agent-submitが書くcommit_msg.txtは、--commit-trailer適用後、glm分岐の
          # final_commit_msg（base + "\n" + 2行のsuffix）とバイト単位で同一になる
          # （ai_pipeline._write_outputsのtrailer追記が同じ"\n{trailer}\n"形式のため）。
          # glm分岐のようにcommit_msg_final.txtへの改名だけ行う。
          cp "$RUNNER_TEMP/commit_msg.txt" "$RUNNER_TEMP/commit_msg_final.txt"

      - name: 変更差分を検証（許可パスの最終再確認、A/Mパスのみ後続の検証ステップへ渡す）
        run: |
          git add -A
          git diff --cached --no-renames -z --name-status | \
            python3 _trusted/.github/scripts/ai_pipeline.py check-diff > "$RUNNER_TEMP/changed_files.txt"

      - name: Nix構文チェック（括弧バランス等。ビルド検証自体はcheck-light.ymlに委ねる）
        run: |
          while IFS= read -r f; do
            case "$f" in
              *.nix)
                echo "checking $f"
                nix-instantiate --parse "$f" > /dev/null
                ;;
            esac
          done < "$RUNNER_TEMP/changed_files.txt"

      - name: 危険な構文のアドバイザリスキャン（ブロックはしない、ラベル付けのみ）
        run: |
          python3 <<'PYEOF'
          import json
          import os
          import sys

          sys.path.insert(0, "_trusted/.github/scripts")
          import ai_pipeline  # noqa: E402

          runner_temp = os.environ["RUNNER_TEMP"]
          with open(os.path.join(runner_temp, "changed_files.txt"), encoding="utf-8") as f:
              changed = [line.strip() for line in f if line.strip()]

          all_hits = set()
          for path in changed:
              with open(path, encoding="utf-8") as f:
                  all_hits.update(ai_pipeline.scan_dangerous_content(f.read()))

          with open(os.path.join(runner_temp, "scan_hits.json"), "w", encoding="utf-8") as f:
              json.dump(sorted(all_hits), f)
          if all_hits:
              print(f"::warning::advisory scan matched {len(all_hits)} pattern(s), PR will be labeled for extra review")
          PYEOF

      - name: コミット・push
        run: |
          git config user.name "ai-issue-handler[bot]"
          git config user.email "ai-issue-handler@users.noreply.github.com"
          git commit -F "$RUNNER_TEMP/commit_msg_final.txt"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" "HEAD:$BRANCH"

      - name: PRを作成（既存なら本文・タイトルを更新）
        run: |
          body_file="$RUNNER_TEMP/pr_body.txt"
          {
            cat "$RUNNER_TEMP/pr_summary.txt"
            echo
            echo "---"
            echo "issue #${ISSUE_NUMBER} からAI（OpenRouter経由のGLM 5.3）が自動生成した変更です。"
            echo "AIはNixコードを直接生成しています。書き込み先パスは modules/ai/**, home/ai/**,"
            echo "tests/ai/** の直下に機械的に制限されていますが、これは能力のサンドボックスでは"
            echo "ありません。**マージ前に必ず全差分を人間がレビューしてください。**"
            echo "\`check-light.yml\` の通過（Nixビルド検証）も確認すること。"
            echo
            echo "Closes #${ISSUE_NUMBER}"
          } > "$body_file"

          existing_pr=$(gh pr list --head "$BRANCH" --json number -q '.[0].number')
          if [ -n "$existing_pr" ]; then
            gh pr edit "$existing_pr" --title "$(cat "$RUNNER_TEMP/pr_title.txt")" --body-file "$body_file"
          else
            gh pr create \
              --title "$(cat "$RUNNER_TEMP/pr_title.txt")" \
              --body-file "$body_file" \
              --base main \
              --head "$BRANCH"
          fi

      - name: アドバイザリスキャンでヒットがあればPRにラベル付け
        run: |
          if [ "$(cat "$RUNNER_TEMP/scan_hits.json")" != "[]" ]; then
            gh label create "needs-careful-review" --color FBCA04 \
              --description "AI content scan flagged a potentially sensitive construct" --force
            pr_number=$(gh pr list --head "$BRANCH" --json number -q '.[0].number')
            gh pr edit "$pr_number" --add-label "needs-careful-review"
          fi

      - name: check-lightを起動
        run: gh workflow run check-light.yml --ref "$BRANCH"
