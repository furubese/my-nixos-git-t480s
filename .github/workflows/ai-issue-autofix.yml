name: AI Issue Autofix

# セキュリティ/設計メモ（v2: 自由なNixコード生成に対応した版）:
# - workflow_dispatch でのみ起動する。トリガー元は check-light.yml の dispatch-autofix
#   ジョブ（mainブランチ上のこのファイル定義で常に実行されるため、ai/issue-* ブランチ側が
#   このファイルを書き換えても権限昇格はできない）。
# - `branch`/`run_id` は信頼できない入力として扱い、`_trusted/.github/scripts/ai_pipeline.py
#   validate-dispatch` で「ブランチ名の形式」「対応PRの存在・作成者・同一リポジトリ」
#   「run_idがそのブランチ・check-lightワークフロー・失敗結論に属すること」を、
#   $BRANCH を実際にcheckoutする前に検証する。
# - _trusted は先にcheckoutして検証に使うため、後続のブランチcheckout（pathなし＝
#   ワークスペースルート）によって削除される。削除される前に $RUNNER_TEMP へ退避する
#   （v5.2で修正：以前はここで_trustedが消えて以降の全ステップが失敗する設計ミスがあった）。
# - AIの書き込み対象・検証方法は ai-issue-handler.yml と同一（modules/ai/**, home/ai/**,
#   tests/ai/** への path allow-list、構文チェックのみ、advisory contentスキャン）。
# - 修正コミットには "AI-Autofix-Attempt: true" というトレーラーを必ず付け、試行回数は
#   このトレーラーを持つコミット数（origin/main..HEAD）で数える。外部の状態ストアは使わない。
on:
  workflow_dispatch:
    inputs:
      branch:
        required: true
        type: string
      run_id:
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write
  issues: write

concurrency:
  group: ai-branch-${{ inputs.branch }}

jobs:
  autofix:
    if: vars.AI_PIPELINE_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BRANCH: ${{ inputs.branch }}
      RUN_ID: ${{ inputs.run_id }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: 信頼済みスクリプトをmainから取得（検証前に必須）
        uses: actions/checkout@v4
        with: { ref: main, path: _trusted, persist-credentials: false }

      - name: 入力検証（ブランチ名・対応PRの存在・作成者・run_idの帰属を確認。ブランチをcheckoutする前に行う）
        run: |
          python3 _trusted/.github/scripts/ai_pipeline.py validate-dispatch \
            --branch "$BRANCH" --run-id "$RUN_ID"

      - name: 信頼済みスクリプトを$RUNNER_TEMPへ退避（後続のブランチcheckoutが_trustedを削除するため）
        run: cp -r _trusted "$RUNNER_TEMP/trusted"

      - name: 対象ブランチをcheckout
        uses: actions/checkout@v4
        with: { ref: "${{ inputs.branch }}", fetch-depth: 0 }
        # 注意：このcheckoutはpath未指定＝ワークスペースルートが対象。actions/checkoutは
        # 対象ディレクトリに一致する.gitが無い場合中身を削除するため、直前に作成した
        # _trusted/ もここで消える。だからこそ上のステップで$RUNNER_TEMPへ退避している。

      - name: 試行回数を確認
        id: attempts
        run: |
          count=$(git log origin/main..HEAD --grep='^AI-Autofix-Attempt: true$' --oneline | wc -l)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "既存の自動修正試行回数: $count"
          if [ "$count" -ge 3 ]; then
            echo "exhausted=true" >> "$GITHUB_OUTPUT"
          else
            echo "exhausted=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 試行上限に達した場合、PRにコメントしてエスカレーション
        if: steps.attempts.outputs.exhausted == 'true'
        run: |
          pr_number=$(gh pr list --head "$BRANCH" --json number -q '.[0].number')
          if [ -n "$pr_number" ]; then
            gh pr comment "$pr_number" --body "自動修正を3回試みましたが、check-light.yml が引き続き失敗しています。これ以上の自動修正は行いません。人間によるレビュー・修正をお願いします（実行run_id: ${RUN_ID}）。"
          fi

      - name: check-light完了を待ってから失敗ログを取得
        if: steps.attempts.outputs.exhausted == 'false'
        run: |
          for i in $(seq 1 30); do
            status=$(gh run view "$RUN_ID" --json status -q .status)
            [ "$status" = "completed" ] && break
            sleep 10
          done
          if [ "$status" != "completed" ]; then
            echo "::error::5分待ってもrunが完了しませんでした。中断します。"
            exit 1
          fi
          gh run view "$RUN_ID" --log-failed > "$RUNNER_TEMP/failure_log.txt" || true
          if [ ! -s "$RUNNER_TEMP/failure_log.txt" ]; then
            echo "::error::失敗ログが空でした。中断します。"
            exit 1
          fi
          tail -n 200 "$RUNNER_TEMP/failure_log.txt" > "$RUNNER_TEMP/failure_log_tail.txt"

      - uses: cachix/install-nix-action@v27
        if: steps.attempts.outputs.exhausted == 'false'

      - name: OpenRouter (GLM 5.3) に修正を依頼し、許可パスへ書き込む
        if: steps.attempts.outputs.exhausted == 'false'
        run: |
          python3 <<'PYEOF'
          import glob
          import json
          import os
          import re
          import sys
          import urllib.request

          sys.path.insert(0, os.path.join(os.environ["RUNNER_TEMP"], "trusted", ".github", "scripts"))
          import ai_pipeline  # noqa: E402

          runner_temp = os.environ["RUNNER_TEMP"]
          failure_log = open(os.path.join(runner_temp, "failure_log_tail.txt"), encoding="utf-8", errors="replace").read()
          api_key = os.environ["OPENROUTER_API_KEY"]

          ai_files = {}
          for pattern in ("modules/ai/*", "home/ai/*", "tests/ai/*"):
              for path in glob.glob(pattern):
                  if os.path.isfile(path) and os.path.basename(path) != "default.nix":
                      ai_files[path] = open(path, encoding="utf-8").read()
          current_block = "\n\n".join(
              f"--- {path} ---\n{content}" for path, content in ai_files.items()
          ) or "(no AI-managed files currently exist)"

          prompt = f"""あなたはNixOS設定リポジトリのCI失敗を修正するアシスタントです。
          以下は、あなたが以前に生成した modules/ai/**, home/ai/**, tests/ai/** 配下の
          ファイル（AIが書き込める範囲はこの3ディレクトリの直下のみ、ネスト禁止）と、
          それをビルドしたCIの失敗ログです。

          {current_block}

          --- CI失敗ログ（末尾200行） ---
          {failure_log}

          失敗原因を修正した「変更後の完全なファイル内容」を、変更が必要なファイルについてのみ
          出力してください（変更不要なファイルは含めない）。新しいファイルを追加して修正しても
          構いませんが、パスは modules/ai/**, home/ai/**, tests/ai/** の直下のみです。
          失敗原因が読み取れない場合は、最も疑わしい変更点を1つ取り除く形で修正してください。

          出力は以下のスキーマのJSONオブジェクト1つのみとしてください。説明文・
          コードブロック・マークダウンのフェンス・前置き・後書きは一切含めないこと：
          {{
            "files": {{ "<許可パス>": "<ファイルの完全な内容>", ... }},
            "title": "<修正内容を要約した短い説明（日本語可）>",
            "summary": "<何をどう修正したかの要約>"
          }}
          """

          req = urllib.request.Request(
              "https://openrouter.ai/api/v1/chat/completions",
              data=json.dumps({
                  "model": "z-ai/glm-5.3",
                  "messages": [{"role": "user", "content": prompt}],
                  "temperature": 0,
              }).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {api_key}",
                  "Content-Type": "application/json",
              },
              method="POST",
          )

          with urllib.request.urlopen(req, timeout=120) as resp:
              response = json.load(resp)

          raw = response["choices"][0]["message"]["content"].strip()
          print(f"AI raw response: {raw}")

          fence_match = re.match(r"^```(?:json)?\s*(.*?)\s*```$", raw, re.DOTALL)
          if fence_match:
              raw = fence_match.group(1).strip()

          try:
              result = json.loads(raw)
          except json.JSONDecodeError:
              print(f"::error::AIの応答がJSONとして解釈できません: {raw!r}")
              sys.exit(1)

          if not isinstance(result, dict) or "files" not in result:
              print("::error::AIの応答に'files'キーがありません。中断します。")
              sys.exit(1)

          files = result["files"]
          title = str(result.get("title") or "autofix")[:100]
          summary = str(result.get("summary") or "(要約なし)")[:2000]

          if not isinstance(files, dict) or not files:
              print("::error::filesが空です。修正内容を生成できなかった可能性があります。中断します。")
              sys.exit(1)

          violations = ai_pipeline.validate_paths(list(files.keys()))
          if violations:
              print(f"::error::許可リスト外のパスが含まれています: {violations}。中断します。")
              sys.exit(1)

          for path, content in files.items():
              if not isinstance(content, str):
                  print(f"::error::{path} の内容が文字列ではありません。中断します。")
                  sys.exit(1)
              os.makedirs(os.path.dirname(path), exist_ok=True)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)
              print(f"wrote {path} ({len(content)} bytes)")

          with open(os.path.join(runner_temp, "expected_files.txt"), "w", encoding="utf-8") as f:
              f.write("\n".join(sorted(files.keys())))
          with open(os.path.join(runner_temp, "commit_msg.txt"), "w", encoding="utf-8") as f:
              f.write(f"autofix: {title}\n\n{summary}\n\nAI-Autofix-Attempt: true\n")
          PYEOF

      - name: 変更が許可リスト・AI申告パスと完全一致することを検証
        if: steps.attempts.outputs.exhausted == 'false'
        run: |
          git add -A
          git diff --cached --name-only | sort > "$RUNNER_TEMP/staged_files.txt"
          sort "$RUNNER_TEMP/expected_files.txt" > "$RUNNER_TEMP/expected_files_sorted.txt"
          if [ ! -s "$RUNNER_TEMP/staged_files.txt" ]; then
            echo "::error::変更がありませんでした。中断します。"
            exit 1
          fi
          if ! diff -q "$RUNNER_TEMP/staged_files.txt" "$RUNNER_TEMP/expected_files_sorted.txt" > /dev/null; then
            echo "::error::実際に変更されたファイルがAI申告分と一致しません。"
            echo "staged:"; cat "$RUNNER_TEMP/staged_files.txt"
            echo "expected:"; cat "$RUNNER_TEMP/expected_files_sorted.txt"
            exit 1
          fi

      - name: Nix構文チェック（括弧バランス等。ビルド検証自体はcheck-light.ymlに委ねる）
        if: steps.attempts.outputs.exhausted == 'false'
        run: |
          while IFS= read -r f; do
            case "$f" in
              *.nix)
                echo "checking $f"
                nix-instantiate --parse "$f" > /dev/null
                ;;
            esac
          done < "$RUNNER_TEMP/staged_files.txt"

      - name: 危険な構文のアドバイザリスキャン（ブロックはしない、ラベル付けのみ）
        if: steps.attempts.outputs.exhausted == 'false'
        run: |
          python3 <<'PYEOF'
          import json
          import os
          import sys

          sys.path.insert(0, os.path.join(os.environ["RUNNER_TEMP"], "trusted", ".github", "scripts"))
          import ai_pipeline  # noqa: E402

          runner_temp = os.environ["RUNNER_TEMP"]
          with open(os.path.join(runner_temp, "staged_files.txt"), encoding="utf-8") as f:
              staged = [line.strip() for line in f if line.strip()]

          all_hits = set()
          for path in staged:
              with open(path, encoding="utf-8") as f:
                  all_hits.update(ai_pipeline.scan_dangerous_content(f.read()))

          with open(os.path.join(runner_temp, "scan_hits.json"), "w", encoding="utf-8") as f:
              json.dump(sorted(all_hits), f)
          if all_hits:
              print(f"::warning::advisory scan matched {len(all_hits)} pattern(s), PR will be labeled for extra review")
          PYEOF

      - name: 修正コミットを同じPRブランチにpush
        if: steps.attempts.outputs.exhausted == 'false'
        run: |
          git config user.name "ai-issue-handler[bot]"
          git config user.email "ai-issue-handler@users.noreply.github.com"
          git commit -F "$RUNNER_TEMP/commit_msg.txt"
          git push origin "HEAD:$BRANCH"

      - name: アドバイザリスキャンでヒットがあればPRにラベル付け
        if: steps.attempts.outputs.exhausted == 'false'
        run: |
          if [ "$(cat "$RUNNER_TEMP/scan_hits.json")" != "[]" ]; then
            gh label create "needs-careful-review" --color FBCA04 \
              --description "AI content scan flagged a potentially sensitive construct" --force
            pr_number=$(gh pr list --head "$BRANCH" --json number -q '.[0].number')
            gh pr edit "$pr_number" --add-label "needs-careful-review"
          fi

      - name: check-lightを再起動
        if: steps.attempts.outputs.exhausted == 'false'
        run: gh workflow run check-light.yml --ref "$BRANCH"
