name: AI Issue Autofix

# セキュリティ/設計メモ（v2: 自由なNixコード生成に対応した版）:
# - workflow_dispatch でのみ起動する。トリガー元は check-light.yml の dispatch-autofix
#   ジョブ（mainブランチ上のこのファイル定義で常に実行されるため、ai/issue-* ブランチ側が
#   このファイルを書き換えても権限昇格はできない）。
# - `branch`/`run_id` は信頼できない入力として扱い、`_trusted/.github/scripts/ai_pipeline.py
#   validate-dispatch` で「ブランチ名の形式」「対応PRの存在・作成者・同一リポジトリ」
#   「run_idがそのブランチ・check-lightワークフロー・失敗結論に属すること」を、
#   $BRANCH を実際にcheckoutする前に検証する。
# - _trusted は先にcheckoutして検証に使うため、後続のブランチcheckout（pathなし＝
#   ワークスペースルート）によって削除される。削除される前に $RUNNER_TEMP へ退避する
#   （v5.2で修正：以前はここで_trustedが消えて以降の全ステップが失敗する設計ミスがあった）。
# - AIへの問い合わせ・許可パスへの読み書き・run_commandによる検証は、3ワークフロー共通の
#   共有エージェントループ（_trusted/.github/scripts/glm_agent.py の run_agent_loop）に
#   委譲する。書き込み対象・検証方法は ai-issue-handler.yml と同一（modules/ai/**, home/ai/**,
#   tests/ai/** への path allow-list、構文チェックのみ、advisory contentスキャン）。
# - 修正コミットには "AI-Autofix-Attempt: true" というトレーラーを必ず付け、試行回数は
#   このトレーラーを持つコミット数（origin/main..HEAD）で数える。外部の状態ストアは使わない。
# - このジョブは vars.AI_PIPELINE_ENABLED（既存マスタースイッチ）に加え、
#   vars.AI_AGENT_LOOP_AUTOFIX が 'true' の場合のみ動く（ANDで追加、段階的ロールアウト用）。
# - エージェント本体は vars.AI_AUTOFIX_ENGINE で切り替える（未設定＝'glm'、'pi' で
#   piハーネスのパイロット）。両分岐を常にmain上に共存させることで、ロールバックが
#   変数の編集1つで完結する（.omc/plans/pi-harness-migration.md ステップ4）。
#   どちらのエンジンでも、初回メッセージの構築・checkout・クレデンシャル確認・
#   check-diff・push は分岐の外にある共通ステップをそのまま使う。
on:
  workflow_dispatch:
    inputs:
      branch:
        required: true
        type: string
      run_id:
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write
  issues: write

concurrency:
  group: ai-branch-${{ inputs.branch }}

jobs:
  autofix:
    if: vars.AI_PIPELINE_ENABLED == 'true' && vars.AI_AGENT_LOOP_AUTOFIX == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BRANCH: ${{ inputs.branch }}
      RUN_ID: ${{ inputs.run_id }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      # glm分岐・pi分岐の両方が参照する唯一の定義箇所。分岐ごとにリテラルを
      # コピーすると、将来値を変えたときに試行回数カウンタ（上の「試行回数を確認」
      # ステップのgrep）と食い違う。
      AUTOFIX_TRAILER: "AI-Autofix-Attempt: true"
      AUTOFIX_PREFIX: "autofix: "
    steps:
      - name: 信頼済みスクリプトをmainから取得（検証前に必須）
        uses: actions/checkout@v4
        with: { ref: main, path: _trusted, persist-credentials: false }

      - name: 入力検証（ブランチ名・対応PRの存在・作成者・run_idの帰属を確認。ブランチをcheckoutする前に行う）
        run: |
          python3 _trusted/.github/scripts/ai_pipeline.py validate-dispatch \
            --branch "$BRANCH" --run-id "$RUN_ID"

      - name: 信頼済みスクリプトを$RUNNER_TEMPへ退避（後続のブランチcheckoutが_trustedを削除するため）
        run: cp -r _trusted "$RUNNER_TEMP/trusted"

      - name: 対象ブランチをcheckout
        uses: actions/checkout@v4
        with: { ref: "${{ inputs.branch }}", fetch-depth: 0, persist-credentials: false }
        # 注意：このcheckoutはpath未指定＝ワークスペースルートが対象。actions/checkoutは
        # 対象ディレクトリに一致する.gitが無い場合中身を削除するため、直前に作成した
        # _trusted/ もここで消える。だからこそ上のステップで$RUNNER_TEMPへ退避している。
        # persist-credentials: false により .git/config にトークンを残さない（pushは
        # 専用ステップでURL引数としてのみ渡す。下の確認ステップ参照）。

      - name: push用クレデンシャルが.git/configに残っていないことを確認
        run: |
          if git config --get-regexp '^http\..*extraheader' >/dev/null 2>&1; then
            echo "::error::credential leak detected: http.*.extraheader is set in .git/config"
            exit 1
          else
            echo "(no extraheader — OK)"
          fi
          remote_url=$(git config --get remote.origin.url)
          case "$remote_url" in
            *x-access-token:*|*@*)
              echo "::error::remote.origin.url にトークン埋め込みの痕跡があります: $remote_url"
              exit 1
              ;;
            *)
              echo "remote.origin.url OK: $remote_url"
              ;;
          esac

      - name: 試行回数を確認（直近の人間の介入＝feedbackコミット以降の連続試行回数のみ数える）
        id: attempts
        run: |
          # origin/main..HEAD 全体のAI-Autofix-Attemptコミット数ではなく、HEADから遡って
          # 連続しているAI-Autofix-Attemptコミットの数だけを数える。人間がPRコメントで
          # ai-issue-feedback.ymlを起動すると（AI-Autofix-Attemptトレーラーを持たない
          # コミットが積まれる）、そこでカウントが自然にリセットされる＝人間が一度見て
          # 手を入れたことを、3回分の試行予算を使い切る明示的な合図として扱う設計。
          count=0
          reset_sha=""
          while read -r sha; do
            if git log -1 --format=%B "$sha" | grep -q '^AI-Autofix-Attempt: true$'; then
              count=$((count + 1))
            else
              reset_sha="$sha"
              break
            fi
          done < <(git log origin/main..HEAD --format=%H)
          if [ -z "$reset_sha" ]; then
            reset_sha=$(git merge-base origin/main HEAD)
          fi
          reset_at=$(git log -1 --format=%cI "$reset_sha")
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "reset_at=$reset_at" >> "$GITHUB_OUTPUT"
          echo "直近の人間介入以降の自動修正試行回数: $count（基準コミット日時: $reset_at）"
          if [ "$count" -ge 3 ]; then
            echo "exhausted=true" >> "$GITHUB_OUTPUT"
          else
            echo "exhausted=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 試行上限に達した場合、PRにコメントしてエスカレーション（今回のサイクルで未投稿の場合のみ）
        if: steps.attempts.outputs.exhausted == 'true'
        env:
          RESET_AT: ${{ steps.attempts.outputs.reset_at }}
        run: |
          pr_number=$(gh pr list --head "$BRANCH" --json number -q '.[0].number')
          if [ -z "$pr_number" ]; then
            exit 0
          fi
          # 試行上限到達後もcheck-lightが失敗するたびにこのジョブ自体は再dispatchされ続ける
          # （check-light側は試行回数を知らないため）。このステップだけで再投稿を止めないと、
          # 同じエスカレーションコメントが際限なく増えてしまう。ただし「今回のサイクル」
          # （直近のfeedback介入=reset_at以降）に限定して判定する。そうしないと、feedbackで
          # リセットされた後に再び3回使い切っても、古いサイクルのコメントのせいで新しい
          # エスカレーション通知が永久に出なくなってしまう。
          already_commented=$(
            gh api --method GET "repos/$GH_REPO/issues/$pr_number/comments" \
              --jq --arg since "$RESET_AT" \
              '[.[] | select(.body | startswith("自動修正を3回試みましたが")) | select(.created_at > $since)] | length'
          )
          if [ "$already_commented" -gt 0 ]; then
            echo "既にエスカレーションコメント済みのため再投稿しない。"
            exit 0
          fi
          gh pr comment "$pr_number" --body "自動修正を3回試みましたが、check-light.yml が引き続き失敗しています。これ以上の自動修正は行いません。人間によるレビュー・修正をお願いします（実行run_id: ${RUN_ID}）。"

      - name: check-light完了を待ってから失敗ログを取得
        if: steps.attempts.outputs.exhausted == 'false'
        run: |
          for i in $(seq 1 30); do
            status=$(gh run view "$RUN_ID" --json status -q .status)
            [ "$status" = "completed" ] && break
            sleep 10
          done
          if [ "$status" != "completed" ]; then
            echo "::error::5分待ってもrunが完了しませんでした。中断します。"
            exit 1
          fi
          gh run view "$RUN_ID" --log-failed > "$RUNNER_TEMP/failure_log.txt" || true
          if [ ! -s "$RUNNER_TEMP/failure_log.txt" ]; then
            echo "::error::失敗ログが空でした。中断します。"
            exit 1
          fi
          tail -n 200 "$RUNNER_TEMP/failure_log.txt" > "$RUNNER_TEMP/failure_log_tail.txt"

      - uses: cachix/install-nix-action@v27
        if: steps.attempts.outputs.exhausted == 'false'

      - name: niriをインストール（run_commandのコールドラン回避。flake.lockのピンを使うため--inputs-from .必須）
        if: steps.attempts.outputs.exhausted == 'false'
        timeout-minutes: 5
        run: nix profile install --inputs-from . nixpkgs#niri

      - name: モデルへの初回メッセージを構築（glm/pi両分岐が同じファイルを読む）
        if: steps.attempts.outputs.exhausted == 'false'
        run: |
          python3 <<'PYEOF'
          import os
          import sys

          sys.path.insert(0, os.path.join(os.environ["RUNNER_TEMP"], "trusted", ".github", "scripts"))
          import ai_pipeline  # noqa: E402

          runner_temp = os.environ["RUNNER_TEMP"]
          with open(os.path.join(runner_temp, "failure_log_tail.txt"), encoding="utf-8", errors="replace") as f:
              raw_failure_log = f.read()
          # CI失敗ログは信頼できない入力として扱う（ビルドされたコード自身がログに
          # 任意の文字列を出力できる）。モデルに渡す前にsanitize_textを通す。
          failure_log = ai_pipeline.sanitize_text(raw_failure_log, max_len=20000)

          initial_message = f"""以下はこのリポジトリのCI失敗ログです。list_dir / read_file で
          modules/ai/, home/ai/, tests/ai/ 配下の既存ファイルを確認し、失敗原因を修正してください。

          --- CI失敗ログ（末尾200行、サニタイズ済み） ---
          {failure_log}
          """

          # 分岐ごとに組み立て直すとglm版とpi版でモデルに渡る文面が食い違う。
          # 構築はここ1箇所だけで行い、両分岐はこのファイルを読むだけにする。
          with open(os.path.join(runner_temp, "initial_message.txt"), "w", encoding="utf-8") as f:
              f.write(initial_message)
          PYEOF

      - name: OpenRouter (GLM 5.3) エージェントループで修正・検証・書き込みを行う
        if: steps.attempts.outputs.exhausted == 'false' && vars.AI_AUTOFIX_ENGINE != 'pi'
        run: |
          python3 <<'PYEOF'
          import os
          import sys

          sys.path.insert(0, os.path.join(os.environ["RUNNER_TEMP"], "trusted", ".github", "scripts"))
          import glm_agent  # noqa: E402

          runner_temp = os.environ["RUNNER_TEMP"]
          with open(os.path.join(runner_temp, "initial_message.txt"), encoding="utf-8") as f:
              initial_message = f.read()

          result = glm_agent.run_agent_loop(
              initial_message,
              commit_trailer=os.environ["AUTOFIX_TRAILER"],
          )
          if result["aborted"]:
              sys.exit(1)

          # 既存のautofixコミットメッセージ規約（"autofix: "プレフィックス）を維持する。
          # pi分岐はこの書き換えを通らない——pi_run.shが--message-prefixをagent-submitへ
          # 渡して同じ接頭辞を付けるため、ここも通すと"autofix: autofix: "になる。
          commit_msg_path = os.path.join(runner_temp, "commit_msg.txt")
          with open(commit_msg_path, encoding="utf-8") as f:
              commit_msg = f.read()
          with open(commit_msg_path, "w", encoding="utf-8") as f:
              f.write(f"{os.environ['AUTOFIX_PREFIX']}{commit_msg}")
          PYEOF

      - name: Cachix（piのビルド用、読み取りのみ・pushなし）
        if: steps.attempts.outputs.exhausted == 'false' && vars.AI_AUTOFIX_ENGINE == 'pi'
        uses: cachix/cachix-action@v15
        with:
          name: nixos-furubese-t480s-5gb
          # check-light.ymlのAIブランチ側と同じ扱い：authTokenを渡さない＝読み取り専用。
          # 既知のギャップ：現時点でpiのビルド成果物をこのキャッシュへpushする経路が
          # 無いため、信頼済みワークフローから事前にpiをビルド・pushする仕組みを
          # 作るまでは毎回キャッシュミスになる（計画v7の論点5）。

      - name: pi ハーネスで修正・検証・書き込みを行う
        if: steps.attempts.outputs.exhausted == 'false' && vars.AI_AUTOFIX_ENGINE == 'pi'
        # $RUNNER_TEMP/trusted配下＝mainのコピーから起動する。ワークスペース側の
        # .github/scripts/を使うと、AIブランチが書き換えたpi_run.sh・pi_wrapper.ts・
        # ai_pipeline.pyが自分への制約を外せてしまう（AGENTS.mdの不変条件）。
        # submitが呼ばれずに終了した場合pi_run.sh自身がexit 1するため、glm分岐の
        # `if result["aborted"]: sys.exit(1)` と同じようにジョブが失敗する。
        run: |
          "$RUNNER_TEMP/trusted/.github/scripts/pi_run.sh" \
            --repo-root "$GITHUB_WORKSPACE" \
            --runner-temp "$RUNNER_TEMP" \
            --message-file "$RUNNER_TEMP/initial_message.txt" \
            --commit-trailer "$AUTOFIX_TRAILER" \
            --message-prefix "$AUTOFIX_PREFIX"

      - name: 実際の変更セットを許可リストに対して最終検証
        if: steps.attempts.outputs.exhausted == 'false'
        run: |
          git add -A
          git diff --cached --no-renames -z --name-status \
            | python3 "$RUNNER_TEMP/trusted/.github/scripts/ai_pipeline.py" check-diff \
            > "$RUNNER_TEMP/staged_files.txt"

      - name: Nix構文チェック（括弧バランス等。ビルド検証自体はcheck-light.ymlに委ねる）
        if: steps.attempts.outputs.exhausted == 'false'
        run: |
          while IFS= read -r f; do
            case "$f" in
              *.nix)
                echo "checking $f"
                nix-instantiate --parse "$f" > /dev/null
                ;;
            esac
          done < "$RUNNER_TEMP/staged_files.txt"

      - name: 危険な構文のアドバイザリスキャン（ブロックはしない、ラベル付けのみ）
        if: steps.attempts.outputs.exhausted == 'false'
        run: |
          python3 <<'PYEOF'
          import json
          import os
          import sys

          sys.path.insert(0, os.path.join(os.environ["RUNNER_TEMP"], "trusted", ".github", "scripts"))
          import ai_pipeline  # noqa: E402

          runner_temp = os.environ["RUNNER_TEMP"]
          with open(os.path.join(runner_temp, "staged_files.txt"), encoding="utf-8") as f:
              staged = [line.strip() for line in f if line.strip()]

          all_hits = set()
          for path in staged:
              with open(path, encoding="utf-8") as f:
                  all_hits.update(ai_pipeline.scan_dangerous_content(f.read()))

          with open(os.path.join(runner_temp, "scan_hits.json"), "w", encoding="utf-8") as f:
              json.dump(sorted(all_hits), f)
          if all_hits:
              print(f"::warning::advisory scan matched {len(all_hits)} pattern(s), PR will be labeled for extra review")
          PYEOF

      - name: 修正コミットを同じPRブランチにpush
        if: steps.attempts.outputs.exhausted == 'false'
        run: |
          git config user.name "ai-issue-handler[bot]"
          git config user.email "ai-issue-handler@users.noreply.github.com"
          git commit -F "$RUNNER_TEMP/commit_msg.txt"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" "HEAD:$BRANCH"

      - name: アドバイザリスキャンでヒットがあればPRにラベル付け
        if: steps.attempts.outputs.exhausted == 'false'
        run: |
          if [ "$(cat "$RUNNER_TEMP/scan_hits.json")" != "[]" ]; then
            gh label create "needs-careful-review" --color FBCA04 \
              --description "AI content scan flagged a potentially sensitive construct" --force
            pr_number=$(gh pr list --head "$BRANCH" --json number -q '.[0].number')
            gh pr edit "$pr_number" --add-label "needs-careful-review"
          fi

      - name: check-lightを再起動
        if: steps.attempts.outputs.exhausted == 'false'
        run: gh workflow run check-light.yml --ref "$BRANCH"
